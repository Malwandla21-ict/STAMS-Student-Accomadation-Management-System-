spring.application.name=stams-backend
server.port=8081

# Local secrets live in backend/.env (git-ignored). See backend/.env.example.
spring.config.import=optional:file:.env[.properties]

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stams_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate/JPA ---
# "update" is fine while iterating; switch to validate once Flyway is introduced.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# --- Issue photos ---
# Saved to this folder (relative to where the app runs) and served from /api/uploads/{name}.
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
